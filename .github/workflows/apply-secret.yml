name: Apply secret to VPS env

# Workflow ad-hoc para actualizar una variable sensible del .env del VPS y
# reiniciar solo el contenedor afectado, sin tocar el resto del stack.
# Se dispara manualmente con `gh workflow run apply-secret.yml`.

on:
  workflow_dispatch:
    inputs:
      var_name:
        description: Variable a setear en .env
        required: true
        default: META_APP_SECRET
        type: choice
        options:
          - META_APP_SECRET
      restart_service:
        description: Contenedor a reiniciar
        required: true
        default: whatsapp
        type: choice
        options:
          - whatsapp
          - api
          - worker
          - dashboard

concurrency:
  group: apply-secret-${{ github.ref }}
  cancel-in-progress: false

# Principio de mínimo privilegio: este workflow solo necesita leer el repo.
# No accede a packages, issues, ni puede escribir a la rama.
permissions:
  contents: read

jobs:
  apply:
    name: Apply ${{ inputs.var_name }} + restart ${{ inputs.restart_service }}
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Update .env and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          VAR_NAME: ${{ inputs.var_name }}
          VAR_VALUE: ${{ secrets[inputs.var_name] }}
          RESTART_SERVICE: ${{ inputs.restart_service }}
        run: |
          port="${DEPLOY_PORT:-22}"
          if [ -z "$VAR_VALUE" ]; then
            echo "❌ Secret $VAR_NAME no está configurado en GitHub Secrets."
            exit 1
          fi


          remote_env="DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH")"
          remote_env="$remote_env VAR_NAME=$(printf '%q' "$VAR_NAME")"
          remote_env="$remote_env VAR_VALUE=$(printf '%q' "$VAR_VALUE")"
          remote_env="$remote_env RESTART_SERVICE=$(printf '%q' "$RESTART_SERVICE")"
          remote_env="$remote_env REGISTRY_URL=$(printf '%q' "$REGISTRY_URL")"
          remote_env="$remote_env IMAGE_NAME=$(printf '%q' "$IMAGE_NAME")"

          ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"


          if [ ! -f .env ]; then
            echo "❌ No existe $DEPLOY_PATH/.env"
            exit 1
          fi

          # Backup defensivo del .env antes de modificar.
          cp .env ".env.bak.$(date -u +%Y%m%dT%H%M%SZ)"

          # Dedup TODAS las ocurrencias previas y reescribe una sola al final.
          python3 - "$VAR_NAME" "$VAR_VALUE" <<'PY'
          import sys
          name, value = sys.argv[1], sys.argv[2]
          with open('.env', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          filtered = [l for l in lines if not l.startswith(f"{name}=")]
          if filtered and not filtered[-1].endswith('\n'):
              filtered[-1] = filtered[-1] + '\n'
          filtered.append(f"{name}={value}\n")
          with open('.env', 'w', encoding='utf-8') as f:
              f.writelines(filtered)
          # Log de control: longitud final leída del .env (sin imprimir el secret).
          import os
          with open('.env', 'r', encoding='utf-8') as f:
              for l in f:
                  if l.startswith(f"{name}="):
                      v = l[len(name)+1:].rstrip('\n')
                      print(f"[apply-secret] {name} escrito (len={len(v)})")
          PY


          # Restart solo del servicio elegido. Recoge el nuevo .env.
          COMPOSE="docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml --profile dashboard"
          $COMPOSE up -d --no-deps "$RESTART_SERVICE"

          # Mapeo nombre de servicio → nombre de contenedor.
          case "$RESTART_SERVICE" in
            whatsapp)  container=whatsapp-saas-whatsapp ;;
            api)       container=whatsapp-saas-api ;;
            worker)    container=whatsapp-saas-worker ;;
            dashboard) container=jestsolution-dashboard ;;
            *)         container="$RESTART_SERVICE" ;;
          esac

          # Esperamos a que llegue a healthy (hasta ~30s).
          for i in $(seq 1 15); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo missing)
            [ "$s" = "healthy" ] && { echo "[apply-secret] $container healthy"; exit 0; }
            sleep 2
          done

          echo "[apply-secret] $container no llegó a healthy (estado=$s)"
          docker logs "$container" --tail 50 || true
          exit 1
          REMOTE
