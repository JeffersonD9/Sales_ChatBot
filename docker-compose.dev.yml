# Development override.
#
# Default dev topology is split by boundary:
#   api       -> http://localhost:3000
#   whatsapp  -> http://localhost:3001/webhook/{slug}
#   worker    -> BullMQ consumer and schedules
#
# External dependencies:
#   DATABASE_URL / PLATFORM_DATABASE_URL / tenant DB URLs
#   REDIS_URL
#
# Optional profiles:
#   --profile ai      starts ai-worker

services:
  api:
    build:
      context: .
      target: dev
    image: jesttech/whatsapp-saas:dev
    container_name: whatsapp-saas-api-dev
    restart: unless-stopped
    command: ["npm", "run", "dev:api"]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development
      API_PORT: 3000
      HEALTHCHECK_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.HEALTHCHECK_PORT||3000;require('http').get('http://localhost:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - internal

  whatsapp:
    build:
      context: .
      target: dev
    image: jesttech/whatsapp-saas:dev
    container_name: whatsapp-saas-whatsapp-dev
    restart: unless-stopped
    command: ["npm", "run", "dev:whatsapp"]
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
      WHATSAPP_PORT: 3001
      HEALTHCHECK_PORT: 3001
      QUEUE_MODE: bullmq
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.HEALTHCHECK_PORT||3001;require('http').get('http://localhost:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - internal

  worker:
    build:
      context: .
      target: dev
    image: jesttech/whatsapp-saas:dev
    container_name: whatsapp-saas-worker-dev
    restart: unless-stopped
    command: ["npm", "run", "dev:worker"]
    env_file: .env
    environment:
      NODE_ENV: development
      QUEUE_MODE: bullmq
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('dotenv').config();require('./src/utils/validateEnv').validateEnv()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - internal

  ai-worker:
    build:
      context: .
      target: dev
    image: jesttech/whatsapp-saas:dev
    container_name: whatsapp-saas-ai-worker-dev
    restart: unless-stopped
    command: ["npm", "run", "dev:ai-worker"]
    env_file: .env
    environment:
      NODE_ENV: development
      AI_QUEUE_MODE: bullmq
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('dotenv').config();require('./src/utils/validateEnv').validateEnv()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - ai
    networks:
      - internal
