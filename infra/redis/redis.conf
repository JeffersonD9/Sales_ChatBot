# Redis configuration for the repo-owned Redis service.
# Used by infra/compose/docker-compose.dev.yml and docker-compose.prod.yml.

# Persistence: AOF is recommended for BullMQ queues.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory: BullMQ requires noeviction to avoid dropping queue keys.
maxmemory 512mb
maxmemory-policy noeviction

# Authentication is applied by Compose when REDIS_PASSWORD is set.
# Do not hardcode secrets here.
# requirepass your-secure-password

# Network: listen only inside Docker's internal network.
# Do not publish Redis in production.
bind 0.0.0.0
protected-mode no

# Connections.
tcp-keepalive 300
timeout 0

# Logging to stdout/stderr for Docker.
loglevel notice
logfile ""
