# Production stack — Hostinger KVM2 (4 vCPU / 8 GB RAM)
#
# Usage (desde la raíz del proyecto):
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml up -d
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml --profile ai up -d
#
# TLS bootstrap (primera vez, antes de levantar nginx definitivo):
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml --profile tls-bootstrap up -d nginx-bootstrap
#   # correr certbot manualmente, luego bajar bootstrap y subir nginx normal
#
# PostgreSQL y Redis viven en este stack como infraestructura interna.
# No se publican puertos de base de datos; solo los servicios en la red
# `internal` pueden conectarse, similar a una VPC privada.

services:

  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-saas-postgres
    restart: unless-stopped
    cpus: "0.80"
    mem_limit: 1536m
    mem_reservation: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform}
      TENANT_DB_NAME_DEFAULT: ${TENANT_DB_NAME_DEFAULT:-tenant_shared_low}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
      - ./infra/postgres/init.sql:/bootstrap/init.sql:ro
      - ./infra/postgres/tenant-init.sql:/bootstrap/tenant-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${PLATFORM_DB_NAME:-platform}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: whatsapp-saas-redis
    restart: unless-stopped
    cpus: "0.30"
    mem_limit: 640m
    mem_reservation: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE:-jestsolution.tech/whatsapp-saas:prod}
    container_name: whatsapp-saas-api
    restart: unless-stopped
    cpus: "0.30"
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "apps/api-core/server.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      HEALTHCHECK_PORT: "3000"
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-platform}
      TENANT_DATABASE_URL_DEFAULT: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${TENANT_DB_NAME_DEFAULT:-tenant_shared_low}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/var/whatsapp-saas/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:'+process.env.HEALTHCHECK_PORT+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp:
    image: ${APP_IMAGE:-jestsolution.tech/whatsapp-saas:prod}
    container_name: whatsapp-saas-whatsapp
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "apps/wa-session-manager/server.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      WHATSAPP_PORT: "3001"
      HEALTHCHECK_PORT: "3001"
      QUEUE_MODE: bullmq
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-platform}
      TENANT_DATABASE_URL_DEFAULT: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${TENANT_DB_NAME_DEFAULT:-tenant_shared_low}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/var/whatsapp-saas/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:'+process.env.HEALTHCHECK_PORT+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${APP_IMAGE:-jestsolution.tech/whatsapp-saas:prod}
    container_name: whatsapp-saas-worker
    restart: unless-stopped
    cpus: "0.80"
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "apps/message-worker/index.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      QUEUE_MODE: bullmq
      QUEUE_CONCURRENCY: "10"
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-platform}
      TENANT_DATABASE_URL_DEFAULT: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${TENANT_DB_NAME_DEFAULT:-tenant_shared_low}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/var/whatsapp-saas/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const r=new(require('ioredis'))(process.env.REDIS_URL||'redis://localhost:6379',{connectTimeout:3000,maxRetriesPerRequest:1,enableReadyCheck:false});r.ping().then(()=>{r.disconnect();process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-worker:
    image: ${APP_IMAGE:-jestsolution.tech/whatsapp-saas:prod}
    container_name: whatsapp-saas-ai-worker
    restart: unless-stopped
    cpus: "0.80"
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "apps/ai-orchestrator/index.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      AI_QUEUE_MODE: bullmq
      AI_QUEUE_CONCURRENCY: "2"
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-platform}
      TENANT_DATABASE_URL_DEFAULT: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${TENANT_DB_NAME_DEFAULT:-tenant_shared_low}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const r=new(require('ioredis'))(process.env.REDIS_URL||'redis://localhost:6379',{connectTimeout:3000,maxRetriesPerRequest:1,enableReadyCheck:false});r.ping().then(()=>{r.disconnect();process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - ai
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./infra/nginx
    image: ${NGINX_IMAGE:-jestsolution.tech/whatsapp-saas-nginx:prod}
    container_name: whatsapp-saas-nginx
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # ADMIN_DOMAIN solo requerido cuando el perfil `dashboard` está activo
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - media_data:/var/whatsapp-saas/media:ro
    depends_on:
      api:
        condition: service_healthy
      whatsapp:
        condition: service_healthy
      # dashboard no está aquí: nginx usa resolución lazy y arranca sin él
    networks:
      - internal
    healthcheck:
      # El vhost del bot tiene server_name=${DOMAIN}; sin Host correcto
      # nginx cae al server default y devuelve 404. Forzamos el Host header
      # para que la request entre al vhost del bot, que tiene location /health
      # proxiando al api.
      test: ["CMD-SHELL", "wget -qO- --header=\"Host: $$DOMAIN\" http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS bootstrap: levanta un nginx mínimo para obtener el primer certificado
  # Uso: --profile tls-bootstrap (antes de levantar nginx definitivo)
  nginx-bootstrap:
    image: nginx:1.27-alpine
    container_name: whatsapp-saas-nginx-bootstrap
    restart: "no"
    profiles:
      - tls-bootstrap
    ports:
      - "80:80"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
    command:
      - /bin/sh
      - -c
      - |
        printf 'server {\n  listen 80;\n  server_name _;\n  location /.well-known/acme-challenge/ { root /var/www/certbot; }\n  location / { return 200 "tls bootstrap ok"; add_header Content-Type text/plain; }\n}\n' > /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
    networks:
      - internal

  # ── Panel admin (OPCIONAL) ───────────────────────────────────────────────────
  # Activo por defecto con el perfil `dashboard`.
  #
  # Desacople en 3 pasos (ver DEPLOY.md#desacople):
  #   1. Quitar admin.conf.template del Dockerfile de nginx
  #   2. Eliminar este bloque del compose
  #   3. Quitar ADMIN_DOMAIN y DASHBOARD_* del .env
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    image: ${DASHBOARD_IMAGE:-jestsolution.tech/dashboard:prod}
    container_name: jestsolution-dashboard
    restart: unless-stopped
    cpus: "0.30"
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_APP_URL: https://${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-platform}
      TENANT_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${DB_PASSWORD}@postgres:5432/${TENANT_DB_NAME_DEFAULT:-tenant_shared_low}
      AUTH_SECRET: ${DASHBOARD_AUTH_SECRET:?DASHBOARD_AUTH_SECRET is required}
      SESSION_TTL_SECONDS: ${DASHBOARD_SESSION_TTL_SECONDS:-28800}
      ALLOWED_IPS: ${DASHBOARD_ALLOWED_IPS:-}
      DB_CONSOLE_WRITES_ENABLED: ${DB_CONSOLE_WRITES_ENABLED:-false}
      PANEL_DOMAIN: ${ADMIN_DOMAIN}
      BOT_DOMAIN: ${DOMAIN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    profiles:
      - dashboard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: whatsapp-saas-certbot
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 32
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/whatsapp-saas/postgres
  redis_data:
    driver: local
  media_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/whatsapp-saas/media

networks:
  internal:
    driver: bridge
