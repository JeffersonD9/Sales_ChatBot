user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Security headers globales
  add_header X-Frame-Options        "DENY"          always;
  add_header X-Content-Type-Options "nosniff"       always;
  add_header Referrer-Policy        "no-referrer"   always;

  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;

  # Rate limit zone para webhooks de Meta
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';

  access_log /var/log/nginx/access.log main;

  # Los virtual hosts se generan desde templates/ via envsubst
  include /etc/nginx/conf.d/*.conf;
}
