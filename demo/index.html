<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Bot WhatsApp — Jest Tech Solutions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111b21;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 750px;
    }

    .header {
      background: #202c33;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px 12px 0 0;
    }
    .avatar {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-info h2 { color: #e9edef; font-size: 15px; font-weight: 600; }
    .header-info p  { color: #8696a0; font-size: 12px; }
    .status-dot {
      width: 8px; height: 8px;
      background: #25d366;
      border-radius: 50%;
      margin-left: auto;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .chat-area {
      flex: 1;
      background: #0b141a;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.6'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: #374045; border-radius: 4px; }

    .bubble-wrap { display: flex; flex-direction: column; max-width: 85%; }
    .bubble-wrap.user { align-self: flex-end; align-items: flex-end; }
    .bubble-wrap.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user { background: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
    .bubble.bot  { background: #202c33; color: #e9edef; border-top-left-radius: 2px; }
    .bubble strong { font-weight: 600; }
    .bubble em     { color: #8696a0; font-style: italic; }

    .time { font-size: 10px; color: #8696a0; margin-top: 2px; padding: 0 4px; }

    .msg-image { width: 100%; max-width: 260px; border-radius: 8px; overflow: hidden; }
    .msg-image img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .msg-image .img-caption {
      background: #202c33; color: #e9edef;
      padding: 8px 10px; font-size: 12.5px; white-space: pre-wrap;
    }

    .interactive-buttons {
      background: #202c33; border-radius: 8px;
      border-top-left-radius: 2px; overflow: hidden; max-width: 280px;
    }
    .interactive-body {
      padding: 8px 12px; color: #e9edef; font-size: 13.5px;
      white-space: pre-wrap; border-bottom: 1px solid #374045;
    }
    .btn-row { display: flex; flex-direction: column; }
    .ia-btn {
      background: none; border: none;
      border-top: 1px solid #374045;
      color: #53bdeb; padding: 10px 14px;
      cursor: pointer; font-size: 13px; text-align: center;
      transition: background 0.15s;
    }
    .ia-btn:first-child { border-top: none; }
    .ia-btn:hover { background: #2a3942; }
    .ia-btn:disabled { opacity: 0.4; cursor: default; }

    .interactive-list {
      background: #202c33; border-radius: 8px;
      border-top-left-radius: 2px; overflow: hidden; max-width: 280px;
    }
    .list-body {
      padding: 8px 12px; color: #e9edef; font-size: 13.5px;
      white-space: pre-wrap; border-bottom: 1px solid #374045;
    }
    .list-open-btn {
      width: 100%; background: none; border: none;
      border-top: 1px solid #374045; color: #53bdeb;
      padding: 10px 14px; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .list-open-btn:hover { background: #2a3942; }
    .list-open-btn:disabled { opacity: 0.4; cursor: default; }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 100;
      justify-content: center; align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: #1f2c34; border-radius: 16px 16px 0 0;
      width: 100%; max-width: 420px; max-height: 70vh;
      overflow-y: auto; padding: 0 0 24px;
    }
    .modal-handle { width: 40px; height: 4px; background: #374045; border-radius: 2px; margin: 12px auto; }
    .modal-title  { color: #e9edef; font-size: 15px; font-weight: 600; padding: 0 16px 8px; }
    .modal-section-title {
      color: #8696a0; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 8px 16px 4px;
    }
    .modal-row {
      padding: 12px 16px; cursor: pointer;
      border-top: 1px solid #2a3942; transition: background 0.15s;
    }
    .modal-row:hover { background: #2a3942; }
    .modal-row-title { color: #e9edef; font-size: 14px; }
    .modal-row-desc  { color: #8696a0; font-size: 12px; margin-top: 2px; }

    .input-area {
      background: #202c33; padding: 8px 10px;
      display: flex; gap: 8px; align-items: center;
      border-radius: 0 0 12px 12px;
    }
    #msg-input {
      flex: 1; background: #2a3942; border: none;
      border-radius: 8px; padding: 10px 14px;
      color: #e9edef; font-size: 14px; outline: none;
    }
    #msg-input::placeholder { color: #8696a0; }
    #send-btn {
      width: 42px; height: 42px; background: #00a884;
      border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }
    #send-btn:hover { background: #017a5e; }
    #send-btn svg { width: 20px; height: 20px; fill: white; }

    .reset-btn {
      background: none; border: 1px solid #374045; border-radius: 6px;
      color: #8696a0; padding: 4px 10px; font-size: 11px;
      cursor: pointer; margin-left: auto; margin-top: 2px;
    }
    .reset-btn:hover { color: #e9edef; border-color: #8696a0; }

    .badge {
      font-size: 10px; background: #005c4b; color: #25d366;
      padding: 2px 6px; border-radius: 4px; margin-left: 6px;
    }

    .typing { display: none; align-self: flex-start; background: #202c33; border-radius: 8px; padding: 10px 14px; }
    .typing span {
      display: inline-block; width: 7px; height: 7px;
      background: #8696a0; border-radius: 50%; margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="avatar">🛍️</div>
    <div class="header-info">
      <h2>Glamour Store <span class="badge">DEMO</span></h2>
      <p>Bot de ventas WhatsApp</p>
    </div>
    <button class="reset-btn" onclick="resetChat()">↺ Reiniciar</button>
    <div class="status-dot"></div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="input-area">
    <input id="msg-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" />
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  const PHONE = 'demo_usuario_001';

  function mdToHtml(text) {
    return text
      .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
      .replace(/_(.*?)_/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function nowTime() {
    return new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  function showTyping() {
    const t = document.getElementById('typing');
    t.style.display = 'block';
    document.getElementById('chat-area').appendChild(t);
    scrollBottom();
  }
  function hideTyping() {
    document.getElementById('typing').style.display = 'none';
  }

  function insertBeforeTyping(el) {
    const area   = document.getElementById('chat-area');
    const typing = document.getElementById('typing');
    area.insertBefore(el, typing);
  }

  function addUserBubble(text) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap user';
    wrap.innerHTML = `
      <div class="bubble user">${mdToHtml(text)}</div>
      <div class="time">${nowTime()} ✓✓</div>`;
    insertBeforeTyping(wrap);
    scrollBottom();
  }

  function addBotMessage(msg) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap bot';

    if (msg.type === 'text') {
      wrap.innerHTML = `
        <div class="bubble bot">${mdToHtml(msg.content)}</div>
        <div class="time">${nowTime()}</div>`;

    } else if (msg.type === 'image') {
      wrap.innerHTML = `
        <div class="msg-image">
          <img src="${msg.url}" alt="producto" loading="lazy" onerror="this.src='https://picsum.photos/400/200'">
          <div class="img-caption">${mdToHtml(msg.caption || '')}</div>
        </div>
        <div class="time">${nowTime()}</div>`;

    } else if (msg.type === 'buttons') {
      const btnsHtml = msg.buttons.map(b =>
        `<button class="ia-btn" onclick="clickButton('${b.id}','${esc(b.title)}',this)">${b.title}</button>`
      ).join('');
      wrap.innerHTML = `
        <div class="interactive-buttons">
          <div class="interactive-body">${mdToHtml(msg.text)}</div>
          <div class="btn-row">${btnsHtml}</div>
        </div>
        <div class="time">${nowTime()}</div>`;

    } else if (msg.type === 'list') {
      const listJson = esc(JSON.stringify(msg));
      wrap.innerHTML = `
        <div class="interactive-list">
          <div class="list-body">${mdToHtml(msg.text)}</div>
          <button class="list-open-btn" onclick='openListModal(${JSON.stringify(msg).replace(/'/g,"\\'")} ,this)'>
            📋 ${msg.buttonText || 'Ver opciones'}
          </button>
        </div>
        <div class="time">${nowTime()}</div>`;
    }

    insertBeforeTyping(wrap);
    scrollBottom();
  }

  function esc(str) {
    return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  async function clickButton(id, title, btnEl) {
    btnEl.closest('.btn-row').querySelectorAll('.ia-btn').forEach(b => b.disabled = true);
    addUserBubble(title);
    showTyping();
    try {
      const res  = await fetch('/demo/interactive', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: PHONE, id, title, interactiveType: 'button_reply' }),
      });
      const data = await res.json();
      hideTyping();
      await renderResponses(data.responses);
    } catch {
      hideTyping();
      addBotMessage({ type: 'text', content: '⚠️ Error de conexión.' });
    }
  }

  function openListModal(listData, btnEl) {
    btnEl.disabled = true;
    document.getElementById('modal-title').textContent = listData.text?.slice(0, 60) || 'Elige una opción';
    const content = document.getElementById('modal-content');
    content.innerHTML = (listData.sections || []).map(section => {
      const rows = (section.rows || []).map(row => `
        <div class="modal-row" onclick="selectListItem('${esc(row.id)}','${esc(row.title)}')">
          <div class="modal-row-title">${row.title}</div>
          ${row.description ? `<div class="modal-row-desc">${row.description}</div>` : ''}
        </div>`).join('');
      return `<div class="modal-section-title">${section.title || ''}</div>${rows}`;
    }).join('');
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('open');
    }
  }

  async function selectListItem(id, title) {
    document.getElementById('modal-overlay').classList.remove('open');
    addUserBubble(title);
    showTyping();
    try {
      const res  = await fetch('/demo/interactive', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: PHONE, id, title, interactiveType: 'list_reply' }),
      });
      const data = await res.json();
      hideTyping();
      await renderResponses(data.responses);
    } catch {
      hideTyping();
      addBotMessage({ type: 'text', content: '⚠️ Error de conexión.' });
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text) return;
    input.value = '';
    addUserBubble(text);
    showTyping();
    try {
      const res  = await fetch('/demo/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: PHONE, message: text }),
      });
      const data = await res.json();
      hideTyping();
      await renderResponses(data.responses);
    } catch {
      hideTyping();
      addBotMessage({ type: 'text', content: '⚠️ No se pudo conectar con el servidor.' });
    }
  }

  async function renderResponses(responses) {
    for (const msg of (responses || [])) {
      await new Promise(r => setTimeout(r, 350));
      addBotMessage(msg);
    }
  }

  async function resetChat() {
    await fetch('/demo/reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: PHONE }),
    });
    const area = document.getElementById('chat-area');
    [...area.children].forEach(el => { if (el.id !== 'typing') el.remove(); });
    await new Promise(r => setTimeout(r, 300));
    addUserBubble('Hola');
    showTyping();
    try {
      const res  = await fetch('/demo/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: PHONE, message: 'Hola' }),
      });
      const data = await res.json();
      hideTyping();
      await renderResponses(data.responses);
    } catch { hideTyping(); }
  }

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  window.addEventListener('load', async () => {
    await new Promise(r => setTimeout(r, 500));
    showTyping();
    try {
      const res  = await fetch('/demo/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: PHONE, message: 'Hola' }),
      });
      const data = await res.json();
      hideTyping();
      await renderResponses(data.responses);
    } catch {
      hideTyping();
      addBotMessage({ type: 'text', content: '👋 ¡Bienvenido al demo!\n\nAsegúrate de que el servidor está corriendo y que DEMO_MODE=true está en tu .env.' });
    }
  });
</script>
</body>
</html>
