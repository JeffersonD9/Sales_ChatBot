<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Panel — WhatsApp SaaS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f16;
      --surface:     #161922;
      --surface-2:   #1e2130;
      --border:      #272b3d;
      --primary:     #5b7fff;
      --primary-dim: rgba(91, 127, 255, 0.15);
      --danger:      #ff5f5f;
      --success:     #3ecf8e;
      --text:        #e2e4ed;
      --muted:       #7b8299;
      --radius:      10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── Auth check overlay ── */
    #auth-check {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Card ── */
    .login-wrap {
      width: 100%; max-width: 400px; padding: 24px;
      opacity: 0; transition: opacity .25s;
    }
    .login-wrap.ready { opacity: 1; }

    .brand {
      text-align: center; margin-bottom: 32px;
    }
    .brand-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--primary-dim);
      margin-bottom: 14px;
      font-size: 24px;
    }
    .brand h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .brand p  { font-size: 13px; color: var(--muted); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em;
    }
    input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    input::placeholder { color: var(--muted); opacity: .6; }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-dim);
    }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 100px var(--surface-2) inset;
      -webkit-text-fill-color: var(--text);
    }

    button[type="submit"] {
      margin-top: 8px;
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      letter-spacing: .01em;
    }
    button[type="submit"]:hover    { opacity: .88; }
    button[type="submit"]:active   { transform: scale(.98); }
    button[type="submit"]:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .error-msg {
      display: flex; align-items: center; gap: 8px;
      margin-top: 14px; padding: 10px 13px;
      background: rgba(255, 95, 95, .1);
      border: 1px solid rgba(255, 95, 95, .25);
      border-radius: 8px;
      color: var(--danger); font-size: 13px;
      opacity: 0; transform: translateY(-4px);
      transition: opacity .2s, transform .2s;
    }
    .error-msg.show { opacity: 1; transform: translateY(0); }

    .footer-note {
      text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--muted);
    }
  </style>
</head>
<body>

<!-- Verificación de sesión existente antes de mostrar el form -->
<div id="auth-check"><div class="spinner"></div></div>

<div class="login-wrap" id="login-wrap">
  <div class="brand">
    <div class="brand-icon">🤖</div>
    <h1>WhatsApp SaaS</h1>
    <p>Panel de administración</p>
  </div>

  <div class="card">
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text"
               autocomplete="username" required
               placeholder="tu_usuario" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required
               placeholder="••••••••">
      </div>
      <button type="submit" id="btn-login">Entrar al panel</button>
    </form>
    <div id="error-msg" class="error-msg" role="alert" aria-live="polite">
      <span>⚠</span><span id="error-text"></span>
    </div>
  </div>

  <p class="footer-note">Acceso restringido · Sesión expira en 15 min</p>
</div>

<script>
'use strict';

const authCheck = document.getElementById('auth-check');
const loginWrap = document.getElementById('login-wrap');
const form      = document.getElementById('login-form');
const btn       = document.getElementById('btn-login');
const errorEl   = document.getElementById('error-msg');
const errorText = document.getElementById('error-text');

function showError(msg) {
  errorText.textContent = msg;
  errorEl.classList.add('show');
}
function hideError() {
  errorEl.classList.remove('show');
}

// Destino tras login — fix open redirect: solo paths simples, no protocol-relative URLs
function getSafeNext() {
  const params = new URLSearchParams(window.location.search);
  const next   = params.get('next') || '';
  // Permitir solo: '/' o rutas que comiencen con exactamente un /
  // Bloquea: '//evil.com', 'http://', rutas vacías, etc.
  return /^\/[^/]/.test(next) ? next : '/panel-ui/dashboard.html';
}

// Verificar si ya hay sesión activa — si sí, ir directo al dashboard
async function checkExistingSession() {
  try {
    const res = await fetch('/panel/auth/me', {
      credentials: 'include',
      cache: 'no-store',
    });
    if (res.ok) {
      window.location.replace(getSafeNext());
      return;
    }
  } catch {
    // Sin sesión o error de red — mostrar el form
  }
  authCheck.style.display = 'none';
  loginWrap.classList.add('ready');
}

// Si viene de bfcache (botón atrás), re-verificar auth
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    authCheck.style.display = 'flex';
    loginWrap.classList.remove('ready');
    checkExistingSession();
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  btn.disabled = true;
  btn.textContent = 'Verificando...';

  try {
    const res = await fetch('/panel/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      cache: 'no-store',
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });

    const data = await res.json();

    if (res.ok && data.ok) {
      window.location.replace(getSafeNext());
    } else {
      showError(data.error || 'Credenciales inválidas');
    }
  } catch {
    showError('Error de conexión. Verifica tu red e intenta nuevamente.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar al panel';
  }
});

// Iniciar
checkExistingSession();
</script>
</body>
</html>
