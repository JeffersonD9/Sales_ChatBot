# ══════════════════════════════════════════════════════
#  docker-compose.prod.yml — Override de PRODUCCIÓN
#
#  Levantar:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Diferencias vs dev:
#    - App con stage `runner` (sin hot reload, sin devDependencies)
#    - SIN puertos expuestos en postgres/redis (red interna solamente)
#    - Restart policy unless-stopped
#    - Logs rotados (max 10MB x 3 archivos por servicio)
#    - Nginx + Certbot al frente
# ══════════════════════════════════════════════════════

services:

  # ── Aplicación ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runner
    image: jesttech/whatsapp-saas:prod
    container_name: whatsapp-saas-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Postgres (sin exponer puerto al host) ──────────────────────────────────
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (sin exponer puerto al host) ─────────────────────────────────────
  redis:
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (proxy HTTPS) ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: whatsapp-saas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot (renovación automática cada 12h) ───────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: whatsapp-saas-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  redis_data:
