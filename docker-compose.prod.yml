# Production override.
#
# Default production topology is split by boundary:
#   api, whatsapp, worker, nginx, certbot
#
# External dependencies:
#   PostgreSQL/MySQL platform and tenant databases
#   Redis for cache, queues and locks
#   Backup flow for databases
#
# Optional profiles:
#   --profile ai      starts ai-worker and enables async AI processing
#   --profile legacy  starts the old single-process app

services:
  api:
    build:
      context: .
      target: runner
    image: jesttech/whatsapp-saas:prod
    container_name: whatsapp-saas-api
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    command: ["node", "src/services/api/server.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      HEALTHCHECK_PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.HEALTHCHECK_PORT||3000;require('http').get('http://localhost:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp:
    image: jesttech/whatsapp-saas:prod
    container_name: whatsapp-saas-whatsapp
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    command: ["node", "src/services/whatsapp/server.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      WHATSAPP_PORT: 3001
      HEALTHCHECK_PORT: 3001
      QUEUE_MODE: bullmq
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.HEALTHCHECK_PORT||3001;require('http').get('http://localhost:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: jesttech/whatsapp-saas:prod
    container_name: whatsapp-saas-worker
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    command: ["node", "src/services/worker/index.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      QUEUE_MODE: bullmq
      NODE_OPTIONS: "--max-old-space-size=384"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('dotenv').config();require('./src/utils/validateEnv').validateEnv()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-worker:
    image: jesttech/whatsapp-saas:prod
    container_name: whatsapp-saas-ai-worker
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 128
    command: ["node", "src/services/ai-worker/index.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      AI_QUEUE_MODE: bullmq
      NODE_OPTIONS: "--max-old-space-size=512"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('dotenv').config();require('./src/utils/validateEnv').validateEnv()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - ai
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: jesttech/whatsapp-saas:prod
    container_name: whatsapp-saas-app
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 128
    env_file: .env
    environment:
      NODE_ENV: production
      HEALTHCHECK_PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=512"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.HEALTHCHECK_PORT||3000;require('http').get('http://localhost:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - legacy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: whatsapp-saas-nginx
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 128
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - whatsapp
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: whatsapp-saas-certbot
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 64
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
